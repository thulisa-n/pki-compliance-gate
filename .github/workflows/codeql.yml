name: CodeQL

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 0"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: ${{ matrix.language }}
          config-file: .github/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2

      # Code scanning ingestion requires GitHub Advanced Security on private
      # repositories. Analysis always runs and the SARIF is always kept as an
      # artifact; only the upload to the Security tab is conditional, so the
      # same workflow works on public repos and on private forks without GHAS.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          output: artifacts/codeql/results
          upload: ${{ (github.event.repository.visibility == 'public' || vars.CODE_SCANNING_UPLOAD == 'true') && 'always' || 'never' }}

      - name: Capture CodeQL run metadata
        if: always()
        run: |
          mkdir -p artifacts/codeql
          echo "code_scanning_upload=${{ (github.event.repository.visibility == 'public' || vars.CODE_SCANNING_UPLOAD == 'true') && 'enabled' || 'artifact-only' }}" > artifacts/codeql/upload-mode.txt
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "ref=${GITHUB_REF}"
            echo "sha=${GITHUB_SHA}"
          } > artifacts/codeql/codeql-run-metadata.txt

      - name: Upload CodeQL run artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-run-artifacts-${{ github.run_id }}
          path: artifacts/codeql
          if-no-files-found: warn
