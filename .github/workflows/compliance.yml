name: Compliance Gate

# Engine, zlint, OPA, SBOM, and signing. Unit tests and the neakam fixture
# matrix live in code-quality.yml so this job does not run the suite twice.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly regression runs (UTC): Monday and Thursday at 05:00
    - cron: "0 5 * * 1,4"
  workflow_dispatch:
    inputs:
      protected_run:
        description: "Enforce protected branch context controls"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: compliance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-compliance:
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      GITHUB_REF_PROTECTED: ${{ github.ref_protected }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install --no-deps -e .

      - name: Install zlint
        run: |
          curl -sL https://github.com/zmap/zlint/releases/download/v3.6.8/zlint_3.6.8_Linux_x86_64.tar.gz -o /tmp/zlint.tar.gz
          echo "fa89ef389b870ae0c409d739b55efe86c29eecc9cf4ddc3e4dcaf7005dfa40aa  /tmp/zlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/zlint.tar.gz --strip-components=1 -C /usr/local/bin
          chmod +x /usr/local/bin/zlint
          zlint --version

      - name: Install OPA
        run: |
          curl -sL https://openpolicyagent.org/downloads/v1.4.2/opa_linux_amd64_static -o /usr/local/bin/opa
          echo "2c0ccdbbe0b8e2a5d12d9c42d92f1f34f494ffb32d1f3c4ddc36101be637d66f  /usr/local/bin/opa" | sha256sum -c -
          chmod +x /usr/local/bin/opa
          opa version

      - name: Generate sample certificate
        run: |
          openssl req -x509 -newkey rsa:2048 -sha256 -days 90 -nodes \
            -keyout /tmp/certguard.key \
            -out /tmp/certguard.pem \
            -subj "/CN=example.com" \
            -addext "subjectAltName=DNS:example.com,DNS:www.example.com"

      - name: Run compliance engine (standard)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.protected_run != true }}
        run: |
          neakam \
            --cert /tmp/certguard.pem \
            --policy policies/cabf_policy.yaml \
            --report reports/compliance_report.json \
            --evidence-dir audit_evidence

      - name: Run compliance engine (protected mode)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.protected_run == true }}
        run: |
          neakam \
            --cert /tmp/certguard.pem \
            --policy policies/cabf_policy.yaml \
            --report reports/compliance_report.json \
            --evidence-dir audit_evidence \
            --protected-run

      - name: Run compliance engine with zlint + OPA enabled
        continue-on-error: true
        run: |
          neakam \
            --cert /tmp/certguard.pem \
            --policy policies/profiles/ci_lint_gate.yaml \
            --report reports/compliance_report_with_lint.json \
            --evidence-dir audit_evidence_lint

      - name: Verify zlint and OPA ran (not skipped)
        run: |
          python -c "
          import json, sys, pathlib
          lint = json.load(open('audit_evidence_lint/lint_results.json'))
          zlint = lint.get('controls', {}).get('zlint', {})
          zlint_status = zlint.get('status', 'missing')
          opa = json.load(open('audit_evidence_lint/opa_results.json'))
          opa_status = opa.get('status', 'missing')
          print(f'zlint status: {zlint_status}')
          print(f'opa   status: {opa_status}')
          if zlint_status == 'skipped':
              print('ERROR: zlint was skipped — binary may not be installed')
              sys.exit(1)
          if opa_status == 'skipped':
              print('ERROR: OPA was skipped — binary may not be installed')
              sys.exit(1)
          if zlint_status == 'fail':
              print('NOTE: zlint found findings on self-signed test cert (expected)')
          print('Both integrations confirmed active')
          "

      - name: Generate reviewer summary
        run: |
          neakam \
            --mode summary \
            --report-input reports/compliance_report.json \
            --summary-output reports/compliance_summary.md

      - name: Generate trend snapshot
        run: |
          neakam \
            --mode trend \
            --report-input reports/compliance_report.json \
            --trend-output reports/compliance_trend_snapshot.json

      - name: Generate SBOM (CycloneDX)
        run: |
          cyclonedx-py requirements requirements.txt \
            --output-format JSON \
            --output-reproducible \
            --output-file reports/sbom.cdx.json

      - name: Generate release provenance manifest
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from certguard.release_provenance import generate_release_provenance
          artifacts = [
              Path("reports/compliance_report.json"),
              Path("reports/compliance_report.json.digest"),
              Path("reports/compliance_report.json.seal"),
              Path("reports/compliance_summary.md"),
              Path("reports/compliance_trend_snapshot.json"),
              Path("reports/sbom.cdx.json"),
              Path("audit_evidence/policy_checks.json"),
              Path("audit_evidence/lint_results.json"),
              Path("audit_evidence/waiver_results.json"),
              Path("audit_evidence/opa_results.json"),
              Path("audit_evidence/evidence_manifest.json"),
              Path("audit_evidence/compliance_decisions.jsonl"),
          ]
          manifest_path, _, signature_path = generate_release_provenance(
              artifact_paths=artifacts,
              output_path=Path("reports/release_provenance.json"),
          )
          if signature_path is not None:
              raise SystemExit("Expected unsigned provenance manifest before keyless signing.")
          if not manifest_path.exists():
              raise SystemExit("Release provenance manifest was not created.")
          PY

      - name: Sign provenance with cosign keyless
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          cosign sign-blob --yes \
            --bundle reports/release_provenance.cosign.bundle \
            reports/release_provenance.json

      - name: Verify cosign signature and identity
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          # Derived from the run context so the identity binding survives repo
          # renames and forks. github.workflow_ref is set by GitHub, not by the
          # signer, so this stays a real assertion rather than a self-issued claim.
          EXPECTED_IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          printf '%s\n' "$EXPECTED_IDENTITY" > reports/release_provenance.identity.txt
          cosign verify-blob \
            --bundle reports/release_provenance.cosign.bundle \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$EXPECTED_IDENTITY" \
            reports/release_provenance.json

      # GitHub-hosted attestation storage is not available for user-owned private
      # repositories. The cosign keyless bundle above is the portable evidence
      # path and always runs; this step adds the lower-friction
      # `gh attestation verify` route wherever the platform supports it.
      - name: Publish GitHub build attestation
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.repository.visibility == 'public' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: reports/release_provenance.json

      - name: Prepare traceable artifact bundle
        run: |
          mkdir -p "artifacts/${GITHUB_RUN_ID}"
          cp reports/compliance_report.json "artifacts/${GITHUB_RUN_ID}/"
          cp reports/compliance_report.json.digest "artifacts/${GITHUB_RUN_ID}/" || true
          cp reports/compliance_report.json.seal "artifacts/${GITHUB_RUN_ID}/"
          cp reports/compliance_summary.md "artifacts/${GITHUB_RUN_ID}/"
          cp reports/compliance_trend_snapshot.json "artifacts/${GITHUB_RUN_ID}/"
          cp reports/sbom.cdx.json "artifacts/${GITHUB_RUN_ID}/"
          if [ -f reports/release_provenance.json ]; then
            cp reports/release_provenance.json "artifacts/${GITHUB_RUN_ID}/"
            cp reports/release_provenance.json.digest "artifacts/${GITHUB_RUN_ID}/"
            cp reports/release_provenance.cosign.bundle "artifacts/${GITHUB_RUN_ID}/"
            cp reports/release_provenance.identity.txt "artifacts/${GITHUB_RUN_ID}/"
          fi
          cp audit_evidence/policy_checks.json "artifacts/${GITHUB_RUN_ID}/"
          cp audit_evidence/lint_results.json "artifacts/${GITHUB_RUN_ID}/"
          cp audit_evidence/waiver_results.json "artifacts/${GITHUB_RUN_ID}/"
          cp audit_evidence/opa_results.json "artifacts/${GITHUB_RUN_ID}/"
          cp audit_evidence/evidence_manifest.json "artifacts/${GITHUB_RUN_ID}/"
          cp audit_evidence/compliance_decisions.jsonl "artifacts/${GITHUB_RUN_ID}/"

      - name: Upload compliance artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: certguard-compliance-artifacts-${{ github.run_id }}
          path: |
            artifacts/${{ github.run_id }}
