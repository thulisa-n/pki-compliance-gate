name: Standards Sync

on:
  schedule:
    - cron: "0 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standards-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-cabf:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install sync dependencies
        run: python -m pip install --require-hashes -r requirements.txt

      - name: Resolve CAB Forum source commit
        id: source
        run: |
          set -euo pipefail
          source_sha="$(git ls-remote https://github.com/cabforum/servercert.git refs/heads/main | awk '{print $1}')"
          if [ -z "${source_sha}" ]; then
            echo "Unable to resolve CAB Forum source commit SHA."
            exit 1
          fi
          echo "sha=${source_sha}" >> "$GITHUB_OUTPUT"

      # The script records the upstream digest only. It never rewrites the
      # dated schedule in policies/standards_baseline.yaml -- a human reads the
      # ballot and edits that file. The previous scraper hard-preferred the
      # string "200" and would have reported "aligned" straight through the
      # 2027-03-15 reduction to 100 days.
      - name: Detect CAB Forum baseline change
        id: detect
        continue-on-error: true
        run: |
          python scripts/sync_cabf_baseline.py \
            --fetch \
            --source-url "https://raw.githubusercontent.com/cabforum/servercert/${{ steps.source.outputs.sha }}/docs/BR.md" \
            --fail-on-change

      - name: Report detection outcome
        run: |
          if [ "${{ steps.detect.outcome }}" = "failure" ]; then
            echo "Upstream Baseline Requirements changed."
            echo "A human must review policies/standards_baseline.yaml."
          else
            echo "Upstream digest unchanged; no review required."
          fi

      # Presence only. The token value is never passed to the review-PR guard
      # script, and this workflow never substitutes github.token: pull requests
      # opened with the default token do not trigger Compliance Gate or
      # Security Scans.
      - name: Note whether the PR token secret is configured
        id: pr_token
        env:
          STANDARDS_SYNC_PR_TOKEN: ${{ secrets.STANDARDS_SYNC_PR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${STANDARDS_SYNC_PR_TOKEN}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "STANDARDS_SYNC_PR_TOKEN is unset. No pull request will be opened."
          fi

      - name: Create pull request if sync changed
        id: review_pr
        if: steps.detect.outcome == 'failure' && steps.pr_token.outputs.present == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.STANDARDS_SYNC_PR_TOKEN }}
          commit-message: "chore(standards): sync CAB Forum baseline snapshot"
          title: "chore(standards): sync CAB Forum baseline snapshot"
          body: |
            ## Summary
            - record a changed CA/B Forum BR source digest
            - request human review of the hand-maintained dated schedule
            - do not automatically rewrite `policies/standards_baseline.yaml`
            - keep `sync.fetched_at` so Standards PR Guard accepts the snapshot
            - opened with `STANDARDS_SYNC_PR_TOKEN` so Compliance Gate and Security Scans run
          branch: chore/standards-sync
          base: main
          delete-branch: true

      - name: Fail when a Baseline Requirements change has no review pull request
        if: always() && steps.detect.outcome == 'failure'
        env:
          PR_NUMBER: ${{ steps.review_pr.outputs.pull-request-number }}
          PR_URL: ${{ steps.review_pr.outputs.pull-request-url }}
          TOKEN_PRESENT: ${{ steps.pr_token.outputs.present }}
        run: bash scripts/require_standards_review_pr.sh

      - name: Capture sync artifacts
        if: always()
        run: |
          mkdir -p artifacts/standards-sync
          cp policies/standards_baseline.yaml artifacts/standards-sync/ 2>/dev/null || true
          cp policies/standards_sync_snapshot.yaml artifacts/standards-sync/ 2>/dev/null || true
          git status --short > artifacts/standards-sync/git-status.txt

      - name: Upload standards sync artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standards-sync-artifacts-${{ github.run_id }}
          path: artifacts/standards-sync
          if-no-files-found: warn
