name: Code Quality

# Lint, type check and coverage. The repository previously had no linter,
# formatter, type checker or coverage measurement anywhere in CI, which is an
# odd gap for a project whose value proposition is rigour.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install enterprise test dependencies
        if: ${{ github.repository == 'thulisa-n/pki-compliance-gate-enterprise' }}
        run: pip install -r requirements-enterprise.txt

      # Blocking: real errors only (syntax, undefined names, unused imports).
      # These were verified clean when the job was introduced.
      - name: Ruff (errors)
        run: ruff check --select E9,F src tests scripts

      # Advisory until the initial backlog is cleared, then promote to blocking
      # by deleting continue-on-error. The full rule set is in pyproject.toml.
      # TODO(0.2.1): clear findings and make these three blocking.
      - name: Ruff (full rule set, advisory)
        run: ruff check src tests scripts
        continue-on-error: true

      - name: Ruff (format check, advisory)
        run: ruff format --check src tests scripts
        continue-on-error: true

      # mypy --strict on a codebase that has never been type checked will
      # report a backlog. Advisory so it reports without blocking; the floor is
      # that it must not get worse.
      - name: mypy (strict, src only, advisory)
        run: mypy
        continue-on-error: true

      - name: Regenerate time-sensitive certificate fixtures
        run: python scripts/generate_test_certificates.py

      - name: Certificate fixture freshness
        run: python scripts/generate_test_certificates.py --check

      - name: Tests with coverage floor
        run: |
          mkdir -p reports/test-results
          pytest -q \
            --cov \
            --cov-report=term-missing \
            --cov-report=xml:reports/test-results/coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.run_id }}
          path: reports/test-results/coverage.xml
          if-no-files-found: warn
