name: Code Quality

# Fastest Python gates first. Ruff blocks the unit job, and the unit job blocks
# the neakam fixture jobs, so a lint or unit failure does not start integration.
# Secret Detection and Security Scans are separate workflows and start
# immediately. Any red job blocks the merge once branch protection requires it.
# See docs/BRANCH_PROTECTION.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Ruff
        run: ruff check src tests scripts

      - name: Ruff format (advisory)
        run: ruff format --check src tests scripts
        continue-on-error: true

      - name: mypy (advisory)
        run: mypy
        continue-on-error: true

  quality:
    needs: ruff
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install --no-deps -e .

      - name: Install enterprise test dependencies
        if: ${{ github.repository == 'thulisa-n/pki-compliance-gate-enterprise' }}
        run: pip install -r requirements-enterprise.txt

      - name: Regenerate time-sensitive certificate fixtures
        run: python scripts/generate_test_certificates.py

      - name: Certificate fixture freshness
        run: python scripts/generate_test_certificates.py --check

      - name: Unit tests with coverage floor
        run: |
          mkdir -p reports/test-results
          pytest -q -m "not integration" \
            --cov \
            --cov-report=term-missing \
            --cov-report=xml:reports/test-results/coverage.xml \
            --junitxml=reports/test-results/pytest-junit.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ github.run_id }}
          path: reports/test-results/coverage.xml
          if-no-files-found: warn

  fixture-matrix:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install --no-deps -e .

      - name: Regenerate time-sensitive certificate fixtures
        run: python scripts/generate_test_certificates.py

      - name: Neakam CLI fixture integration
        run: pytest -q tests/test_cli_integration.py -k "not strict_profile"

  strict-profile-smoke:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install --no-deps -e .

      - name: Regenerate time-sensitive certificate fixtures
        run: python scripts/generate_test_certificates.py

      - name: Strict profile through the neakam CLI
        run: pytest -q tests/test_cli_integration.py -k strict_profile
