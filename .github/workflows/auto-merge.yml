name: Auto Merge

# Enables GitHub auto-merge for trusted bot PRs once required checks are green.
# This workflow does not change branch protection. The settings to apply by
# hand are listed in docs/BRANCH_PROTECTION.md. Squash is the merge method.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable-auto-merge:
    permissions:
      contents: write
      pull-requests: write
    if: >
      github.event.pull_request.draft == false && (
        github.actor == 'dependabot[bot]' ||
        (
          github.event.pull_request.head.ref == 'chore/standards-sync' &&
          startsWith(github.event.pull_request.title, 'chore(standards):')
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Enable squash auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          gh pr merge --auto --squash "$PR_URL"
          echo "Auto-merge enabled for $PR_URL"
