name: Docs Render

on:
  push:
    paths:
      - "**/*.md"
      - "**/*.adoc"
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.adoc"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-render-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve base reference
        id: base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            candidate="$PR_BASE_SHA"
          else
            candidate="$PUSH_BEFORE_SHA"
          fi
          # A force-push leaves the previous SHA unreachable, and a new branch
          # reports all zeros, so fall back to the parent commit in both cases.
          if ! git cat-file -e "${candidate}^{commit}" 2>/dev/null; then
            candidate="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
            echo "Base reference unavailable; diffing against ${candidate} instead."
          fi
          echo "ref=${candidate}" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Generate DOCX/PDF final and redline docs
        run: |
          python scripts/generate_docs_artifacts.py \
            --base-ref "${{ steps.base.outputs.ref }}" \
            --output-dir artifacts/docs

      - name: Upload rendered doc artifacts
        uses: actions/upload-artifact@v7
        with:
          name: docs-render-${{ github.run_id }}
          path: artifacts/docs
