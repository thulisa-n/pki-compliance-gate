[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pki-compliance-gate"
version = "0.2.4"
description = "Automated PKI Compliance Engine for X.509 certificates and Policy-as-Code governance"
readme = "README.md"
authors = [{ name = "Thulisa Nikani", email = "thulisa.nikani@rethinkit.co.za" }]
license = "Apache-2.0"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security :: Cryptography",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]
dependencies = [
    "cryptography>=41.0.0",
    "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "cyclonedx-bom>=7.0",
    "mypy>=1.11",
    "pytest>=9.0",
    "pytest-cov>=5.0",
    "ruff>=0.6"
]

[project.scripts]
pki-gate = "certguard.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["certguard", "certguard.*"]

[tool.setuptools.package-data]
"certguard.data" = ["*.yaml", "*.json"]

[tool.pytest.ini_options]
# "." keeps tests.support importable from conftest and from
# scripts/generate_test_certificates.py.
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    # Long lines in policy/standard reference strings are more readable intact.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately build long literal fixtures.
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true
# Third-party stubs are not shipped for these.
[[tool.mypy.overrides]]
module = ["yaml", "cyclonedx.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/certguard"]
branch = true

[tool.coverage.report]
# Raise this floor as coverage improves; it exists to stop regression.
fail_under = 70
show_missing = true
skip_covered = true
