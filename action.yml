name: 'PKI Compliance Gate'
description: 'Policy-as-Code gate for X.509 certificates, CA/B Forum Baseline Requirements, and API TLS posture in CI/CD'
author: 'Thulisa Nikani'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  cert:
    description: 'Path to PEM certificate file'
    required: false
  policy:
    description: 'Optional path to a policy YAML file in the caller workspace'
    required: false
    default: ''
  mode:
    description: 'Execution mode (evaluate, apisec, summary, export-cps-doc, ...)'
    required: false
    default: 'evaluate'
  report:
    description: 'Path for output compliance report JSON'
    required: false
    default: 'reports/compliance_report.json'
  output:
    description: 'Output format (text, json)'
    required: false
    default: 'text'
  endpoint:
    description: 'Target host or URL for apisec mode'
    required: false

outputs:
  exit_code:
    description: 'Compliance gate status code (0: compliant, 1: low, 2: med/high, 3: critical)'
    value: ${{ steps.gate.outputs.exit_code }}
  report_path:
    description: 'Path to generated JSON compliance report'
    value: ${{ steps.gate.outputs.report_path }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PKI Compliance Gate
      run: python -m pip install "${{ github.action_path }}"
      shell: bash

    - name: Run PKI Compliance Gate
      id: gate
      env:
        INPUT_CERT: ${{ inputs.cert }}
        INPUT_ENDPOINT: ${{ inputs.endpoint }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_POLICY: ${{ inputs.policy }}
        INPUT_REPORT: ${{ inputs.report }}
      run: |
        policy="${INPUT_POLICY:-${{ github.action_path }}/policies/cabf_policy.yaml}"
        args=(
          --mode "$INPUT_MODE"
          --policy "$policy"
          --report "$INPUT_REPORT"
          --output "$INPUT_OUTPUT"
        )
        if [ -n "$INPUT_CERT" ]; then
          args+=(--cert "$INPUT_CERT")
        fi
        if [ -n "$INPUT_ENDPOINT" ]; then
          args+=(--endpoint "$INPUT_ENDPOINT")
        fi

        set +e
        pki-gate "${args[@]}"
        code=$?
        set -e
        {
          echo "exit_code=$code"
          echo "report_path=$INPUT_REPORT"
        } >> "$GITHUB_OUTPUT"
        exit "$code"
      shell: bash
