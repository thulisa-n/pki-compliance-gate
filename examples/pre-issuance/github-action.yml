# Copy into a caller workflow. Pin the public tag, not a branch.
name: neakam
on:
  pull_request:
  push:
    branches: [main]
jobs:
  evaluate-issued:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Evaluate issued certificate
        uses: thulisa-n/pki-compliance-gate@v0.2.5
        with:
          cert: path/to/server.crt
          as-of: "2026-09-18"
  evaluate-csr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Evaluate CSR before issuance
        uses: thulisa-n/pki-compliance-gate@v0.2.5
        with:
          csr: path/to/request.csr
