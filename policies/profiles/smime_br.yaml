metadata:
  policy_schema_version: "2.0"
  standard: "CA/Browser Forum S/MIME Baseline Requirements"
  version: "2026.2"
  last_updated: "2026-04-01"
  terms: "S/MIME profile overlay for CertGuard policy-as-code simulation"

terms:
  - id: "CABF-SMIME-3.2.2"
    title: "S/MIME Mailbox Validation"
    summary: "CAs MUST validate the applicant's control over the email address to be included."
  - id: "CABF-SMIME-7.1.2"
    title: "S/MIME Certificate Content"
    summary: "S/MIME certificates MUST include the emailAddress in SAN or subject."
  - id: "CABF-SMIME-6.1.5"
    title: "S/MIME Key Size Requirements"
    summary: "RSA keys MUST be at least 2048 bits for S/MIME certificates."
  - id: "CABF-SMIME-4.9"
    title: "S/MIME Revocation Requirements"
    summary: "CAs MUST provide revocation services for S/MIME certificates via CRL or OCSP."

certificate:
  max_validity_days: 200
  require_san: true
  # Expiry enforcement is on by default from policy schema 2.0. Before this,
  # only the LENGTH of the validity window was checked, so a certificate that
  # had already expired evaluated as fully compliant.
  reject_expired: true
  reject_not_yet_valid: true
  # Renewal pressure is operational, not a compliance defect: a certificate
  # valid for another 10 days is still compliant. Set a positive number of days
  # to surface it as a low-severity finding (exit code 1).
  warn_if_expires_within_days: 0

key:
  minimum_rsa_bits: 2048
  # Key policy applies to every algorithm from schema 2.0. Previously any
  # non-RSA key skipped key-strength checks entirely, so a 192-bit EC
  # certificate passed unchallenged.
  allowed_algorithms:
    - rsa
    - ec
  minimum_ec_bits: 256
  # CA/Browser Forum BR 6.1.5 permits only these NIST curves for subscriber
  # ECDSA keys.
  allowed_ec_curves:
    - secp256r1
    - secp384r1
    - secp521r1

signature:
  prohibited_algorithms:
    - sha1
    - md5

domains:
  forbid_internal_names: true
  blocked_suffixes:
    - ".local"
    - ".internal"
    - ".intranet"

lint:
  enable_zlint: true
  fail_on_error: true
  fail_severities:
    - "error"
    - "fatal"
  enable_asn1parse: true
  fail_on_asn1_error: true

dcv:
  required: true
  allowed_methods:
    - "dns-01"
    - "http-01"
  max_age_days: 30

rfc5280:
  require_end_entity_not_ca: true
  require_key_usage: true
  required_key_usages:
    - "digital_signature"
  require_subject_key_identifier: true
  require_authority_key_identifier: true
  allowed_critical_extensions:
    - "2.5.29.15"
    - "2.5.29.19"
  require_path_issuer_subject_match: true
  require_path_aki_ski_match: true

opa:
  enabled: false
  policy_file: "policies/rego/validity.rego"

issuance:
  require_hsm_attestation: true
  min_fips_level: 2
